# Nginx 로그 로테이션 설정
# - 공용 access/error 로그와 BossPickSeoul dev 전용 access 로그를 함께 관리
# - 로그 회전 후 nginx reopen 명령으로 새 파일에 다시 기록

nocompress
missingok
create 0640 root root

/var/log/nginx/access.log {
    daily
    dateext
    dateformat -%Y%m%d
    rotate 14
    sharedscripts
    postrotate
        docker exec nginx nginx -s reopen
    endscript
}

# BossPickSeoul 개발 API 전용 access 로그
/var/log/nginx/bosspickseoul_dev_access.log {
    daily
    dateext
    dateformat -%Y%m%d
    rotate 14
    sharedscripts
    postrotate
        docker exec nginx nginx -s reopen
    endscript
}

/var/log/nginx/error.log {
    daily
    dateext
    dateformat -%Y%m%d
    rotate 14
    sharedscripts
    postrotate
        docker exec nginx nginx -s reopen
    endscript
}
