# Nginx log rotation
# - keep the shared access/error logs and the dedicated BossPickSeoul dev access log
# - reopen Nginx logs after each rotation

nocompress
missingok
create 0640 root root

/var/log/nginx/access.log {
    daily
    dateext
    dateformat -%Y%m%d
    rotate 14
    sharedscripts
    postrotate
        docker exec nginx nginx -s reopen
    endscript
}

/var/log/nginx/bosspickseoul_dev_access.log {
    daily
    dateext
    dateformat -%Y%m%d
    rotate 14
    sharedscripts
    postrotate
        docker exec nginx nginx -s reopen
    endscript
}

/var/log/nginx/error.log {
    daily
    dateext
    dateformat -%Y%m%d
    rotate 14
    sharedscripts
    postrotate
        docker exec nginx nginx -s reopen
    endscript
}
