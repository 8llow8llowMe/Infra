services:
  minio:
    image:
    container_name: minio
    ports:
      - '9000:9000' # minIO API
      - '50001:9001' # minIO Web UI
    volumes:
      - ./minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    restart: unless-stopped
