services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - '9000:9000' # minIO API
      - '50001:9001' # minIO Web UI
    volumes:
      - ./minio-data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - 8llow8llowme-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    driver: bridge
