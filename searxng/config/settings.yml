use_default_settings: true

general:
  debug: false
  instance_name: "AI Host Search"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: ""
  formats:
    - html
    - json

server:
  secret_key: "change-me-before-production"
  limiter: false
  image_proxy: true

ui:
  static_use_hash: true

outgoing:
  request_timeout: 5.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20
