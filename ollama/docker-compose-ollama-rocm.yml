# Optional AMD ROCm override.
# Use only after the Linux host exposes /dev/kfd and /dev/dri correctly.

services:
  ollama:
    image: ${OLLAMA_ROCM_IMAGE}
    devices:
      - "${AMD_GPU_KFD_DEVICE}:${AMD_GPU_KFD_DEVICE}"
      - "${AMD_GPU_DRI_DEVICE}:${AMD_GPU_DRI_DEVICE}"
    group_add:
      - ${AMD_GPU_GROUP}
    environment:
      HSA_OVERRIDE_GFX_VERSION: ${HSA_OVERRIDE_GFX_VERSION}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
