services:
  nginx:
    container_name: nginx
    restart: always
    build:
      context: .
      dockerfile: nginx.Dockerfile
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./conf.d:/etc/nginx/conf.d
      - ./logs:/var/log/nginx # Fail2Ban + logrotate 전용
      - ../certbot/webroot:/var/www/certbot # Certbot 인증서 발급 시 HTTP-01 챌린지 응답 경로
      - ../certbot/letsencrypt:/etc/letsencrypt # SSL 인증서 및 키 파일 저장소
    logging:
      driver: 'json-file' # Docker 기본 로그 드라이버 (컨테이너 stdout/stderr 수집)
      options:
        max-size: '100m' # 로그 파일이 100MB 도달하면 자동 롤링
        max-file: '5' # 최대 5개의 롤링된 로그 파일 보관
    networks:
      - 8llow8llowme-net

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    driver: bridge
