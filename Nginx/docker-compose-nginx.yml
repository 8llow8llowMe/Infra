services:
  nginx:
    container_name: nginx
    restart: always
    build:
      context: .
      dockerfile: nginx.Dockerfile
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # 메인 설정 및 가상호스트 설정
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./conf.d:/etc/nginx/conf.d

      # 로그 공유 — Fail2Ban 및 logrotate 컨테이너에서 참조
      - ./logs:/var/log/nginx

      # Certbot (HTTP-01 챌린지 및 인증서 공유)
      - ../certbot/webroot:/var/www/certbot
      - ../certbot/letsencrypt:/etc/letsencrypt

    logging:
      driver: 'json-file' # Docker 기본 로깅 (stdout/stderr 수집)
      options:
        max-size: '100m'  # 로그 파일 100MB 초과 시 자동 롤링
        max-file: '5'     # 최대 5개 파일까지 보관

    networks:
      - 8llow8llowme-net

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    driver: bridge
