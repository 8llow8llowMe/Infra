server {
    listen 80;
    server_name www.tripmarble.com;

    # 도메인별 access log
    access_log /var/log/nginx/tripmarble_access.log main;

    # index.html 캐싱 완전 방지
    location = /index.html {
        proxy_pass http://minio:9000/tripmarble/client/index.html;
        expires    -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma       "no-cache";
        add_header Expires      0;
    }

    # Next.js 정적 SPA 파일 제공 + 히스토리 라우팅 처리
    location / {
        # MinIO 버킷(tripmarble)의 모든 요청을 그대로 전달
        proxy_pass http://minio:9000/tripmarble/frontend/web;
        # 원본 요청 헤더 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        try_files $uri $uri/ /index.html; # 파일이 없으면 index.html로 포워딩
    }

    # 인증/인가, 회원 서비스 -> 8081, /auth-service/와 그 하위 모두 매칭
    location /auth-service/ {
        rewrite ^/auth-service(/.*)$ $1 break;
        proxy_pass http://192.168.0.46:8081;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Gateway -> 8000, /api-gateway/와 그 하위 모두 매칭
    location /api-gateway/ {
        rewrite ^/api-gateway(/.*)$ $1 break;
        proxy_pass http://192.168.0.46:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
