# ──────────────────────────────────────────
# HTTP: tripmarble.com + www → HTTPS 리다이렉트
# ──────────────────────────────────────────
server {
    listen 80;
    server_name tripmarble.com www.tripmarble.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.tripmarble.com$request_uri;
    }
}

# ──────────────────────────────────────────
# HTTPS: tripmarble.com → www 리다이렉트
# ──────────────────────────────────────────
server {
    listen 443 ssl;
    server_name tripmarble.com;

    ssl_certificate /etc/letsencrypt/live/tripmarble.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tripmarble.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.tripmarble.com$request_uri;
}

# ──────────────────────────────────────────
# HTTPS: www.tripmarble.com (메인)
# ──────────────────────────────────────────
server {
    listen 443 ssl;
    server_name www.tripmarble.com;

    ssl_certificate /etc/letsencrypt/live/tripmarble.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tripmarble.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://web-ssr:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}