server {
    listen 80;
    server_name www.jamjamnow.com;

    # 도메인별 access log
    access_log /var/log/nginx/jamjamnow_access.log main;

    # index.html 캐싱 방지
    location = /index.html {
        proxy_pass http://minio:9000/www.jamjamnow.com/index.html;

        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 정적 파일 (MinIO) 프록시
    location / {
        proxy_pass http://minio:9000/www.jamjamnow.com/; # 추후에 minIO 관련 사설 IP로 할당해서 매핑하는 것으로 변경
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://jamjamnow-backend:8080; # 추후에 해당 서비스의 백엔드 관련 사설 IP로 할당해서 매핑하는 것으로 변경
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
