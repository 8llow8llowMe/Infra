# 1. Jenkins API (GitHub 등 외부 통신용, non-www 고정)
# jenkins.8llow8llowme.com HTTP → HTTPS
server {
    listen 80;
    server_name jenkins.8llow8llowme.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jenkins.8llow8llowme.com$request_uri;
    }
}

# www.jenkins.8llow8llowme.com HTTP → non-www HTTPS
server {
    listen 80;
    server_name www.jenkins.8llow8llowme.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://jenkins.8llow8llowme.com$request_uri;
    }
}

# www.jenkins.8llow8llowme.com HTTPS → non-www HTTPS
server {
    listen 443 ssl;
    server_name www.jenkins.8llow8llowme.com;

    ssl_certificate /etc/letsencrypt/live/jenkins.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://jenkins.8llow8llowme.com$request_uri;
    }
}

# 최종 Jenkins API 서버 (jenkins.8llow8llowme.com, non-www)
server {
    listen 443 ssl;
    server_name jenkins.8llow8llowme.com;

    ssl_certificate /etc/letsencrypt/live/jenkins.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/jenkins_api_access.log main;

    location / {
        proxy_pass http://192.168.0.54:49999/;  # Jenkins API 백엔드 서버
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        # WebSocket 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

