# jenkins.8llow8llowme.com -> www.jenkins.8llow8llowme.com 리다이렉트 (HTTP)
server {
    listen 80;
    server_name jenkins.8llow8llowme.com;

    # Let's Encrypt challenge 파일 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지는 www.jenkins.8llow8llowme.com HTTPS로 리다이렉트
    location / {
        return 301 https://www.jenkins.8llow8llowme.com$request_uri;
    }
}

# www.jenkins.8llow8llowme.com HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    server_name www.jenkins.8llow8llowme.com;

    # Let's Encrypt challenge 파일 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# jenkins.8llow8llowme.com -> www.jenkins.8llow8llowme.com 리다이렉트 (HTTPS)
server {
    listen 443 ssl;
    server_name jenkins.8llow8llowme.com;

    ssl_certificate /etc/letsencrypt/live/jenkins.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # www.jenkins.8llow8llowme.com으로 리다이렉트
    location / {
        return 301 https://www.jenkins.8llow8llowme.com$request_uri;
    }
}

# 메인 Jenkins 서버 설정 (www.jenkins.8llow8llowme.com)
server {
    listen 443 ssl;
    server_name www.jenkins.8llow8llowme.com;

    ssl_certificate /etc/letsencrypt/live/jenkins.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jenkins.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 도메인별 access log
    access_log /var/log/nginx/jenkins_access.log main;

    # Jenkins 리버스 프록시
    location / {
        proxy_pass http://192.168.0.54:49999/;  # 젠킨스가 띄워진 해당 서버의 사설 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jenkins UI 동작 안정성을 위해 추가
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        
        # Jenkins WebSocket 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # 타임아웃 설정
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }
}
