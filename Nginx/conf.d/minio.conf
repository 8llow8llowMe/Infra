# minio.8llow8llowme.com -> www.minio.8llow8llowme.com 리다이렉트 (HTTP)
server {
    listen 80;
    server_name minio.8llow8llowme.com;

    # Let's Encrypt challenge 파일 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 나머지는 www.minio.8llow8llowme.com HTTPS로 리다이렉트
    location / {
        return 301 https://www.minio.8llow8llowme.com$request_uri;
    }
}

# www.minio.8llow8llowme.com HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    server_name www.minio.8llow8llowme.com;

    # Let's Encrypt challenge 파일 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# minio.8llow8llowme.com -> www.minio.8llow8llowme.com 리다이렉트 (HTTPS)
server {
    listen 443 ssl;
    server_name minio.8llow8llowme.com;

    ssl_certificate /etc/letsencrypt/live/minio.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # www.minio.8llow8llowme.com으로 리다이렉트
    location / {
        return 301 https://www.minio.8llow8llowme.com$request_uri;
    }
}

# 메인 MinIO 서버 설정 (www.minio.8llow8llowme.com)
server {
    listen 443 ssl;
    server_name www.minio.8llow8llowme.com;

    ssl_certificate /etc/letsencrypt/live/minio.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # MinIO 버킷/파일 직접 접근 (모든 프로젝트)
    location ~ ^/[^/]+/ {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # MinIO CORS 공통 설정
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control, User-Agent, Referer" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Type, Last-Modified" always;

        # OPTIONS 요청 처리 (CORS preflight)
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control, User-Agent, Referer";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
    }

    # MinIO Web UI 정적 파일들 (콘솔 리소스)
    location ~ ^/(static|styles)/ {
        proxy_pass http://minio:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO Web UI 콘솔 (관리자 페이지)
    location / {
        proxy_pass http://minio:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # MinIO Web UI를 위한 추가 헤더
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
