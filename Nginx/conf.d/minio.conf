# 1. MinIO API/버킷 (공개용, non-www 고정)
# minio.8llow8llowme.com HTTP → HTTPS
server {
    listen 80;
    server_name minio.8llow8llowme.com;

    location /.well-known/acme-challenge/ { 
        root /var/www/certbot; 
    }

    location / { 
        return 301 https://minio.8llow8llowme.com$request_uri; 
    }
}

# www.minio.8llow8llowme.com HTTP → non-www HTTPS
server {
    listen 80;
    server_name www.minio.8llow8llowme.com;

    location /.well-known/acme-challenge/ { 
        root /var/www/certbot; 
    }

    location / { 
        return 301 https://minio.8llow8llowme.com$request_uri; 
    }
}

# www.minio.8llow8llowme.com HTTPS → non-www HTTPS
server {
    listen 443 ssl;
    server_name www.minio.8llow8llowme.com;

    ssl_certificate /etc/letsencrypt/live/minio.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / { 
        return 301 https://minio.8llow8llowme.com$request_uri; 
    }
}

# 최종 API 서버 (minio.8llow8llowme.com, non-www)
server {
    listen 443 ssl;
    server_name minio.8llow8llowme.com;

    ssl_certificate /etc/letsencrypt/live/minio.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minio.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS 설정
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control, User-Agent, Referer" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Type, Last-Modified" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
            add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization, Cache-Control, User-Agent, Referer";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type "text/plain; charset=utf-8";
            add_header Content-Length 0;
            return 204;
        }
    }
}

# 2. MinIO WebUI (운영자 전용)
# non-www (console.minio...) HTTP → console HTTPS
server {
    listen 80;
    server_name console.minio.8llow8llowme.com;

    location /.well-known/acme-challenge/ { 
        root /var/www/certbot; 
    }

    location / { 
        return 301 https://console.minio.8llow8llowme.com$request_uri; 
    }
}

# www.console HTTP → HTTPS
server {
    listen 80;
    server_name www.console.minio.8llow8llowme.com;

    location /.well-known/acme-challenge/ { 
        root /var/www/certbot; 
    }

    location / { 
        return 301 https://console.minio.8llow8llowme.com$request_uri; 
    }
}

# www.console HTTPS → non-www HTTPS
server {
    listen 443 ssl;
    server_name www.console.minio.8llow8llowme.com;

    ssl_certificate /etc/letsencrypt/live/console.minio.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.minio.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://console.minio.8llow8llowme.com$request_uri;
    }
}

# 최종 WebUI (console.minio..., HTTPS 전용)
server {
    listen 443 ssl;
    server_name console.minio.8llow8llowme.com;

    ssl_certificate /etc/letsencrypt/live/console.minio.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.minio.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://minio:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
