# api.nowdoboss.com (HTTP -> HTTPS 리다이렉트)
server {
    listen 80;
    server_name api.nowdoboss.com;

    # Let's Encrypt 인증서 발급용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.nowdoboss.com$request_uri;
    }
}

# api.nowdoboss.com (HTTPS, API 프록시 처리)
server {
    listen 443 ssl;
    server_name api.nowdoboss.com;

    ssl_certificate /etc/letsencrypt/live/api.nowdoboss.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nowdoboss.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 업로드 요청 최대 크기
    client_max_body_size 150M;

    # API 엔드포인트 프록시
    location /api {
        proxy_pass http://192.168.0.46:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 구독 (Server-Sent Events)
    location /api/v1/sse/subscribe {
        proxy_pass http://192.168.0.46:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;

        # 타임아웃 설정
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
        keepalive_timeout 6m;
    }

    # WebSocket 엔드포인트
    location /ws {
        proxy_pass http://192.168.0.46:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
