server {
    listen 80;
    server_name www.nowdoboss.com;

    # 도메인별 access log
    access_log /var/log/nginx/nowdoboss_access.log main;

    # index.html 캐싱 방지
    location = /index.html {
        proxy_pass http://minio:9000/www.nowdoboss.com/index.html;

        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # 정적 파일 (MinIO) 프록시
    location / {
        proxy_pass http://minio:9000/www.nowdoboss.com/; # 추후에 minIO 관련 사설 IP로 할당해서 매핑하는 것으로 변경
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://nowdoboss-backend:8080; # 추후에 해당 서비스의 백엔드 관련 사설 IP로 할당해서 매핑하는 것으로 변경
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/sse/subscribe {
        proxy_pass http://nowdoboss-backend:8080; # 추후에 해당 서비스의 백엔드 관련 사설 IP로 할당해서 매핑하는 것으로 변경
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off; # 버퍼링 비활성화

        # 타임아웃 설정
        proxy_read_timeout 31m; # 백엔드 SseEmitter의 타임아웃보다 1분 더 길게 설정
        proxy_send_timeout 31m;
        keepalive_timeout 32m;
    }

    location /ws {
        proxy_pass http://nowdoboss-backend:8080; # 추후에 해당 서비스의 백엔드 웹소켓 관련 사설 IP로 할당해서 매핑하는 것으로 변경
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
