# NGINX 전역 설정
# - 파일 로그 + stdout 로그 병행 구조 (tail 기반)
# - Fail2Ban, logrotate용 파일 로그 유지
# - ELK 등 중앙 수집은 stdout 기반 수집

user nginx;
worker_processes auto;

# 에러 로그: 파일 + stderr 병행 출력
#  - stderr 로그는 Docker log driver 또는 ELK로 수집
error_log /var/log/nginx/error.log warn;
error_log /dev/stderr warn;


pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 로그 포맷 정의
    log_format main '$server_name $scheme $remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 액세스 로그 설정
    # (1) 파일 로그 — Fail2Ban, 수동 확인 및 logrotate 대상
    access_log /var/log/nginx/access.log main;

    # (2) stdout 로그 — tail 프로세스가 별도로 출력 (Docker log driver / ELK 수집용)
    # - Nginx는 파일에만 쓰고, Dockerfile CMD에서 tail -F로 stdout 복제 처리

    # 성능 및 네트워크 기본 설정
    sendfile        on;
    keepalive_timeout  65;

    # 압축 설정
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 가상 호스트 설정 포함
    # conf.d 디렉토리 내 각 도메인별 설정 (tripmarble.conf 등)
    include /etc/nginx/conf.d/*.conf;
}
