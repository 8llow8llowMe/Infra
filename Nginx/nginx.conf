user nginx;
worker_processes auto;

# 에러 로그를 stderr에도 출력 (중앙 수집용)
error_log /var/log/nginx/error.log warn;
error_log /dev/stderr warn;

pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 로그 포맷 정의
    log_format main '$server_name $scheme $remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # (1) 파일 로그 — Fail2Ban + 보관용
    access_log /var/log/nginx/access.log main;

    # (2) stdout — 중앙 로그 수집용 (docker logging driver)
    access_log /dev/stdout main;

    sendfile        on;
    keepalive_timeout  65;

    # 압축 설정
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 가상 호스트 설정 포함 (tripmarble.conf, nowdoboss.conf 등)
    include /etc/nginx/conf.d/*.conf;
}
