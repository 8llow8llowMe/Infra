[Definition]
# 악성/자동화 User-Agent 기반 탐지 (access.log 기준)
# - sqlmap, nmap, masscan, nikto 등 보안 스캐너
# - curl, wget, python-requests 등 스크립트 호출
# - 크롤러·봇·취약점 스캐너 전용 차단
failregex = ^\S+\s+\S+\s+<HOST>\s+-\s+-\s+\[.*\]\s+".*HTTP.*"\s+\d+\s+\d+\s+".*"\s+"(?i:.*(sqlmap|nikto|nmap|masscan|zgrab|httpx|acunetix|nessus|dirbuster|wpscan|fimap|whatweb|curl|wget|python-requests|libwww-perl|httperf|morfeus|zmEu|scanner|bot|spider|crawler).*")$
ignoreregex =
