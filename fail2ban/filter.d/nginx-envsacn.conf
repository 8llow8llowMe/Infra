[Definition]
# error.log 내에서 .env 파일을 접근하려는 시도를 탐지
# sample error.log: 2025/11/04 16:51:14 [error] 10#10: *43817 open() "/etc/nginx/html/app/config/.env" failed (2: No such file or directory), client: 104.214.168.172, ...
failregex = ^.*open\(\)\s+".*\.env"\s+failed.*client:\s*<HOST>\b
ignoreregex =