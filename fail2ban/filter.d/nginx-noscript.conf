[Definition]
# 스크립트/확장자 요청 차단 (access.log)
# - .php, .asp, .pl, .exe 등 서버사이드 스크립트 탐지
# - 워드프레스 등 외부 CMS 관련 경로 요청 차단
failregex = ^\S+\s+\S+\s+<HOST>\s+-\s+-\s+\[.*\]\s+".*?/(?:wp-admin|wp-includes|wp-content|wp-login\.php|xmlrpc\.php|.*\.(?:php|asp|pl|exe))\b.*HTTP.*"\s+(?:301|302|400|403|404|444)?
ignoreregex =
