apiVersion: 1

# 프로비저닝된 datasource는 Git을 원본으로 관리합니다.
# 대시보드 JSON은 이름이 아니라 고정 uid(prometheus)로 참조하므로 uid를 바꾸지 않습니다.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # 긴 쿼리에서도 안전하도록 POST로 조회합니다.
      httpMethod: POST
      # scrape_interval과 맞춰 $__rate_interval 계산과 step 힌트를 정확하게 합니다.
      timeInterval: 30s
      manageAlerts: false
      prometheusType: Prometheus
      cacheLevel: Low
