services:
  node-exporter:
    image: ${NODE_EXPORTER_IMAGE}
    container_name: ${NODE_EXPORTER_CONTAINER_NAME}
    restart: unless-stopped
    # 컨테이너 내부에서 호스트의 proc/sys/rootfs를 읽어 host metric을 노출합니다.
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run/docker/netns)($$|/)
    ports:
      - '${NODE_EXPORTER_PORT}:9100'
    volumes:
      # node_exporter가 컨테이너가 아닌 호스트 기준 지표를 읽기 위한 마운트입니다.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  promtail:
    image: ${PROMTAIL_IMAGE}
    container_name: ${PROMTAIL_CONTAINER_NAME}
    restart: unless-stopped
    profiles:
      - logs
    # 환경변수 기반 Loki push URL과 host/project 라벨을 promtail.yml에 주입합니다.
    command:
      - -config.file=/etc/promtail/promtail.yml
      - -config.expand-env=true
    environment:
      LOKI_PUSH_URL: ${LOKI_PUSH_URL}
      PROMTAIL_HOSTNAME: ${PROMTAIL_HOSTNAME}
      PROMTAIL_PROJECT: ${PROMTAIL_PROJECT}
      TZ: ${TZ}
    volumes:
      # Docker socket을 읽어 컨테이너 로그와 라벨을 자동 탐색합니다.
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./promtail-data:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
