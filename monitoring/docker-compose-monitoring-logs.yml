services:
  loki:
    image: ${LOKI_IMAGE}
    container_name: ${LOKI_CONTAINER_NAME}
    restart: unless-stopped
    # 환경변수 기반 retention 값을 loki.yml에 주입합니다.
    command:
      - -config.file=/etc/loki/loki.yml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD}
      TZ: ${TZ}
    ports:
      - '${LOKI_PORT}:3100'
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ./loki-data:/loki
    networks:
      - 8llow8llowme-net
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  promtail:
    image: ${PROMTAIL_IMAGE}
    container_name: ${PROMTAIL_CONTAINER_NAME}
    restart: unless-stopped
    depends_on:
      - loki
    command:
      - -config.file=/etc/promtail/promtail.yml
      - -config.expand-env=true
    environment:
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
      PROMTAIL_HOSTNAME: deploy
      PROMTAIL_PROJECT: infra
      TZ: ${TZ}
    volumes:
      # Docker socket을 읽어 컨테이너 로그와 라벨을 자동 탐색합니다.
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./promtail-data:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - 8llow8llowme-net
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    driver: bridge
