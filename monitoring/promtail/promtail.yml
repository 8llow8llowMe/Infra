server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_PUSH_URL}

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /(.+)
        target_label: container
      - source_labels: [__meta_docker_container_name]
        regex: /(.+)
        replacement: $1
        target_label: deployment
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: (.+)-(dev|prod)
        replacement: $1
        target_label: service
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: (.+)-(dev|prod)
        replacement: $2
        target_label: env
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: (.+)-(dev|prod)
        replacement: service
        target_label: service_group
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: (service-discovery|api-gateway)-(dev|prod)
        replacement: cloud
        target_label: service_group
      - source_labels: [service]
        regex: (.+)
        replacement: $1
        target_label: application
      - source_labels: [__meta_docker_container_label_com_docker_compose_project]
        target_label: compose_project
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      - target_label: host
        replacement: ${PROMTAIL_HOSTNAME}
      - target_label: project
        replacement: ${PROMTAIL_PROJECT}
      - source_labels: [__meta_docker_container_label_observability_project]
        regex: (.+)
        replacement: $1
        target_label: project
      - source_labels: [__meta_docker_container_label_observability_group]
        regex: (.+)
        replacement: $1
        target_label: service_group
      - source_labels: [__meta_docker_container_label_observability_service]
        regex: (.+)
        replacement: $1
        target_label: service
      - source_labels: [__meta_docker_container_label_observability_env]
        regex: (.+)
        replacement: $1
        target_label: env
      - source_labels: [__meta_docker_container_label_observability_application]
        regex: (.+)
        replacement: $1
        target_label: application
      - source_labels: [__meta_docker_container_label_observability_deployment]
        regex: (.+)
        replacement: $1
        target_label: deployment
      - source_labels: [project, service_group]
        regex: (.+);(.+)
        replacement: $1-$2
        target_label: job
    pipeline_stages:
      - docker: {}
