# NGINX 전역 설정
# - 파일 로그와 stdout/stderr 로그를 함께 운영하는 구조
# - Fail2Ban, logrotate는 파일 로그를 사용
# - Docker 로그 수집기, ELK 등은 stdout/stderr 로그를 사용

user nginx;
worker_processes auto;

# 1. 에러 로그 설정
# 파일 로그는 운영 점검용, stderr 로그는 컨테이너 로그 수집용으로 사용합니다.
error_log /var/log/nginx/error.log warn;
error_log /dev/stderr warn;

pid /var/run/nginx.pid;

events {
    # 2. 워커 프로세스 연결 수 설정
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 3. 공통 액세스 로그 포맷 정의
    # 서버명, 스킴, 클라이언트 IP, 요청 정보, 응답 코드 등을 기록합니다.
    log_format main '$server_name $scheme $remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # 4. 액세스 로그 파일 설정
    # 파일 로그는 Fail2Ban, logrotate, 운영자 수동 확인에 사용합니다.
    access_log /var/log/nginx/access.log main;

    # 5. 기본 성능 설정
    sendfile on;
    keepalive_timeout 65;

    # 6. 응답 압축 설정
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;

    # 7. 도메인별 가상 호스트 설정 포함
    include /etc/nginx/conf.d/*.conf;
}
