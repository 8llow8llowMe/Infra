# BossPickSeoul 운영 API 라우팅 설정
# - api.bosspickseoul.com 요청을 api-gateway-prod(호스트 포트 9000)로 전달
# - SSE, WebSocket 경로를 명시적으로 분리하여 처리

server {
    listen 80;
    server_name api.bosspickseoul.com;

    # Let's Encrypt HTTP-01 인증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 운영 API 도메인도 HTTP 요청은 HTTPS로 강제 전환
    location / {
        return 301 https://api.bosspickseoul.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.bosspickseoul.com;

    ssl_certificate /etc/letsencrypt/live/api.bosspickseoul.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.bosspickseoul.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 업로드 요청 최대 크기 제한
    client_max_body_size 150M;

    # 일반 REST API 요청 전달
    location /api {
        proxy_pass http://192.168.0.13:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE 구독 요청은 버퍼링 없이 장시간 연결 유지
    location /api/v1/sse/subscribe {
        proxy_pass http://192.168.0.13:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
        keepalive_timeout 6m;
    }

    # WebSocket 업그레이드 요청 전달
    location /ws {
        proxy_pass http://192.168.0.13:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }

    # API 외 경로는 노출하지 않음
    location / {
        return 404;
    }
}
