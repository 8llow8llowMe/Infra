# Kafka UI(kafbat) 도메인 설정
# - 모든 HTTP 요청은 HTTPS로 전환
# - www 도메인은 non-www 도메인으로 정규화
# - Kafka UI 백엔드는 ollama/vault 서버(192.168.0.10:18080)로 전달
#
# 중요: Kafka UI 는 Grafana/Vault 와 달리 자체 로그인이 없습니다.
# 공개망에 그대로 노출하면 누구나 토픽 목록, 메시지 본문, consumer group 을 열람할 수 있으므로
# nginx basic auth 를 필수로 둡니다. htpasswd 파일이 없으면 nginx 가 500 을 반환합니다.
#
# htpasswd 생성 (nginx 컨테이너에는 htpasswd 가 없어 httpd 이미지를 일회성으로 사용):
#   cd ~/infra/nginx
#   docker run --rm httpd:2.4-alpine htpasswd -nbB <사용자명> '<비밀번호>' > conf.d/.htpasswd-kafka-ui
#   docker exec nginx nginx -t && docker exec nginx nginx -s reload
#
# conf.d 는 컨테이너에 마운트되어 있고 nginx 는 conf.d/*.conf 만 include 하므로
# .htpasswd-kafka-ui 파일은 설정으로 읽히지 않습니다. (Git 에는 커밋되지 않도록 .gitignore 처리)

# Kafka UI HTTP -> HTTPS 리다이렉트
server {
    listen 80;
    server_name kafka-ui.8llow8llowme.com;

    # Let's Encrypt 인증서 발급용 challenge 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kafka-ui.8llow8llowme.com$request_uri;
    }
}

# Kafka UI www HTTP -> non-www HTTPS 리다이렉트
server {
    listen 80;
    server_name www.kafka-ui.8llow8llowme.com;

    # Let's Encrypt 인증서 발급용 challenge 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://kafka-ui.8llow8llowme.com$request_uri;
    }
}

# Kafka UI www HTTPS -> non-www HTTPS 리다이렉트
server {
    listen 443 ssl;
    server_name www.kafka-ui.8llow8llowme.com;

    ssl_certificate /etc/letsencrypt/live/kafka-ui.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kafka-ui.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://kafka-ui.8llow8llowme.com$request_uri;
    }
}

# Kafka UI 실제 백엔드 연결
server {
    listen 443 ssl;
    server_name kafka-ui.8llow8llowme.com;

    ssl_certificate /etc/letsencrypt/live/kafka-ui.8llow8llowme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kafka-ui.8llow8llowme.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 관리 UI 는 검색엔진에 노출할 이유가 없다.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 메시지 produce 등에 쓰는 요청 본문 크기
    client_max_body_size 20M;

    location / {
        # Kafka UI 자체 인증이 없으므로 여기서 막는다.
        auth_basic "Kafka UI";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd-kafka-ui;

        # 사설망만 허용하려면 아래 2줄의 주석을 풀고 auth_basic 2줄을 지운다.
        # (외부에서 접속할 일이 없다면 이 방식이 더 안전하다)
        #allow 192.168.0.0/24;
        #deny all;

        proxy_pass http://192.168.0.10:18080;
        proxy_http_version 1.1;

        # 원본 요청 정보를 Kafka UI 에 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # 토픽 메시지 실시간 조회(SSE/WebSocket) 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 대용량 토픽 조회가 오래 걸릴 수 있어 여유를 둔다.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
    }
}
