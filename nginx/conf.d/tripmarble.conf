# tripmarble 메인 웹 서비스 설정
# - HTTP 요청은 HTTPS로 리다이렉트
# - apex 도메인(tripmarble.com)은 www 도메인으로 정규화
# - 실제 서비스는 www.tripmarble.com 에서 Next.js SSR 서버로 프록시

# 1. HTTP 요청을 HTTPS www 도메인으로 리다이렉트
server {
    listen 80;
    server_name tripmarble.com www.tripmarble.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.tripmarble.com$request_uri;
    }
}

# 2. HTTPS apex 도메인을 www 도메인으로 정규화
server {
    listen 443 ssl;
    server_name tripmarble.com;

    ssl_certificate /etc/letsencrypt/live/tripmarble.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tripmarble.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.tripmarble.com$request_uri;
}

# 3. 실제 서비스 트래픽을 SSR 애플리케이션으로 전달
server {
    listen 443 ssl;
    server_name www.tripmarble.com;

    ssl_certificate /etc/letsencrypt/live/tripmarble.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tripmarble.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://web-ssr:3000;
        proxy_http_version 1.1;

        # WebSocket/SSR 환경 호환 헤더
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
