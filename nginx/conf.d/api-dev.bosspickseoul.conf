# BossPickSeoul API development routing.
# - api-dev.bosspickseoul.com -> api-gateway-dev (host port 6000)
# - write to a dedicated dev access log while keeping the global access log

server {
    listen 80;
    server_name api-dev.bosspickseoul.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api-dev.bosspickseoul.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api-dev.bosspickseoul.com;

    ssl_certificate /etc/letsencrypt/live/api-dev.bosspickseoul.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-dev.bosspickseoul.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 150M;
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/bosspickseoul_dev_access.log main;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location /api {
        proxy_pass http://192.168.0.13:6000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/sse/subscribe {
        proxy_pass http://192.168.0.13:6000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
        keepalive_timeout 6m;
    }

    location /ws {
        proxy_pass http://192.168.0.13:6000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 5m;
        proxy_send_timeout 5m;
    }

    location / {
        return 404;
    }
}
