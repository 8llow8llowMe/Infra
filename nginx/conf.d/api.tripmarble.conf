# tripmarble API 도메인 설정
# - HTTP는 HTTPS로 강제 전환
# - 경로별로 내부 API 서버 포트를 분리해 전달

# 1. HTTP 요청을 HTTPS로 리다이렉트
server {
    listen 80;
    server_name api.tripmarble.com;

    # Certbot HTTP-01 인증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.tripmarble.com$request_uri;
    }
}

# 2. HTTPS API 요청 처리
server {
    listen 443 ssl;
    server_name api.tripmarble.com;

    ssl_certificate /etc/letsencrypt/live/api.tripmarble.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tripmarble.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 업로드 요청 허용 크기
    client_max_body_size 150M;

    # 인증/회원 관련 요청
    location /auth-service/ {
        proxy_pass http://192.168.0.46:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Gateway 요청
    location /api-gateway/ {
        proxy_pass http://192.168.0.46:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
