# BossPickSeoul 운영 웹 라우팅 설정
# - bosspickseoul.com 요청은 https://www.bosspickseoul.com 으로 정규화
# - 운영 FE(bosspickseoul-web-prod) 배포 전까지는 점검(503) 응답
#   (공유 컨테이너명 web-ssr 프록시를 제거해 tripmarble 컨테이너로 새지 않도록 함)
# - FE 배포 후 아래 "배포 후" 블록으로 교체하면 bosspickseoul-web-prod:3000 으로 전달

server {
    listen 80;
    server_name bosspickseoul.com;

    # Let's Encrypt HTTP-01 인증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # apex 도메인 HTTP 요청은 www HTTPS 주소로 전환
    location / {
        return 301 https://www.bosspickseoul.com$request_uri;
    }
}

server {
    listen 80;
    server_name www.bosspickseoul.com;

    # Let's Encrypt HTTP-01 인증 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # www 도메인 HTTP 요청은 동일 호스트의 HTTPS로 전환
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bosspickseoul.com;

    ssl_certificate /etc/letsencrypt/live/bosspickseoul.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bosspickseoul.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # apex HTTPS 요청도 최종적으로 www 도메인으로 정규화
    location / {
        return 301 https://www.bosspickseoul.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.bosspickseoul.com;

    ssl_certificate /etc/letsencrypt/live/bosspickseoul.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bosspickseoul.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 운영 FE(bosspickseoul-web-prod) 미배포 상태 — 점검 응답을 반환한다.
    # 이전에는 공유 컨테이너명 web-ssr:3000 으로 프록시되어 tripmarble Next.js가 응답했다.
    location / {
        default_type text/plain;
        return 503 "BossPickSeoul web is not deployed yet.";
    }

    # === FE(bosspickseoul-web-prod) 배포 후: 위 location / 을 지우고 아래를 사용 ===
    # (bosspickseoul-web-prod 컨테이너를 8llow8llowme-net 에 띄운 뒤 교체 + reload)
    # location / {
    #     proxy_pass http://bosspickseoul-web-prod:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_cache_bypass $http_upgrade;
    # }
}
