# BossPickSeoul web production routing.
# - bosspickseoul.com -> https://www.bosspickseoul.com
# - https://www.bosspickseoul.com -> web-ssr:3000

server {
    listen 80;
    server_name bosspickseoul.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.bosspickseoul.com$request_uri;
    }
}

server {
    listen 80;
    server_name www.bosspickseoul.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bosspickseoul.com;

    ssl_certificate /etc/letsencrypt/live/bosspickseoul.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bosspickseoul.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        return 301 https://www.bosspickseoul.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.bosspickseoul.com;

    ssl_certificate /etc/letsencrypt/live/bosspickseoul.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bosspickseoul.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://web-ssr:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
