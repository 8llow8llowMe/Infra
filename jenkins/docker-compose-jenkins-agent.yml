services:
  # 원격 서버에 배치하는 배포 전용 Jenkins inbound agent입니다.
  # 미니PC build agent는 docker-compose-jenkins.yml의 jenkins-builder-agent를 사용합니다.
  jenkins-deploy-agent:
    image: jenkins-agent-custom:latest
    container_name: jenkins-deploy-agent
    restart: unless-stopped
    build:
      context: .
      dockerfile: jenkins-agent.Dockerfile
    env_file:
      - .env
    environment:
      JENKINS_URL: ${JENKINS_URL}
      JENKINS_AGENT_NAME: ${JENKINS_DEPLOY_AGENT_NAME:-backend-1-deploy}
      JENKINS_AGENT_SECRET: ${JENKINS_DEPLOY_AGENT_SECRET}
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
    volumes:
      - ./jenkins-deploy-agent:/home/jenkins/agent
      - /var/run/docker.sock:/var/run/docker.sock
      # - /home/projects:/home/jenkins/projects
    networks:
      - 8llow8llowme-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    driver: bridge
