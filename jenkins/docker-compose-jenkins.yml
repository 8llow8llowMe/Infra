services:
  jenkins-controller:
    container_name: jenkins-controller
    restart: unless-stopped
    build:
      context: .
      dockerfile: jenkins.Dockerfile
    environment:
      JENKINS_OPTS: ${JENKINS_OPTS:-}
      JAVA_OPTS: ${JENKINS_CONTROLLER_JAVA_OPTS:--Xms512m -Xmx2048m}
    ports:
      - "${JENKINS_WEB_PORT:-49999}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - ./jenkins-home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - 8llow8llowme-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  jenkins-builder-agent:
    container_name: jenkins-builder-agent
    restart: unless-stopped
    depends_on:
      - jenkins-controller
    build:
      context: .
      dockerfile: jenkins-agent.Dockerfile
    environment:
      JENKINS_URL: ${JENKINS_URL:-http://jenkins-controller:8080}
      JENKINS_AGENT_NAME: ${JENKINS_BUILDER_NAME:-minipc-builder}
      JENKINS_AGENT_SECRET: ${JENKINS_BUILDER_SECRET:-change-me-after-node-created}
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
    volumes:
      - ./jenkins-builder-agent:/home/jenkins/agent
      - jenkins-builder-agent-gradle:/home/jenkins/.gradle
      - jenkins-builder-agent-npm:/home/jenkins/.npm
      - jenkins-builder-agent-pnpm:/home/jenkins/.local/share/pnpm
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - 8llow8llowme-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  8llow8llowme-net:
    name: 8llow8llowme-net
    driver: bridge

volumes:
  jenkins-builder-agent-gradle:
  jenkins-builder-agent-npm:
  jenkins-builder-agent-pnpm:
